spring.application.name=avera-tplp3-2026

# H2 en archivo: el estado sobrevive a un reinicio del servicio.
spring.datasource.url=jdbc:h2:file:./data/minecraft;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA crea/actualiza el esquema a partir de las anotaciones de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Consola web para inspeccionar las tablas en desarrollo.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# POO-09: documento OpenAPI y puerto externalizable.
app.puerto=${SERVER_PORT:8080}
server.port=${app.puerto}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Clientes hacia A2 y A3. Por defecto apuntan a los stubs locales de este repo;
# el día del grupo se reemplazan con A2_BASE_URL, A3_BASE_URL y sus rutas reales.
integracion.a2.base-url=${A2_BASE_URL:http://localhost:${app.puerto}/integracion/stub}
integracion.a2.path=${A2_VALIDATE_PATH:/a2/validar}
integracion.a3.base-url=${A3_BASE_URL:http://localhost:${app.puerto}/integracion/stub}
integracion.a3.path=${A3_VALIDATE_PATH:/a3/validar}
integracion.client.timeout-seconds=${INTEGRACION_TIMEOUT_SECONDS:5}

# Reglas de los stubs temporales usados hasta conocer a los compañeros.
integracion.stub.a2.escudos-minimos=${A2_ESCUDOS_MINIMOS:1}
integracion.stub.a3.potencia-maxima=${A3_POTENCIA_MAXIMA:8}
