spring.application.name=avera-tplp3-2026

# H2 en archivo: el estado sobrevive a un reinicio del servicio.
spring.datasource.url=jdbc:h2:file:./data/minecraft;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA crea/actualiza el esquema a partir de las anotaciones de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Consola web para inspeccionar las tablas en desarrollo.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
